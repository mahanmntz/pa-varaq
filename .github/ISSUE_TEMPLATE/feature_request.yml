name: Feature request
description: Suggest an idea or improvement
labels: ["type:feature", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Pa-Varaq favours simple, low-friction features. **Never paste real phone numbers, national IDs or birth dates (use fake values like 09120000000).**
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [api, web, shared, db, docs, infra, not sure]
    validations:
      required: true
